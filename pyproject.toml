[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlb-aging"
version = "0.1.0"
description = "MLB position player aging curves via GAM with IPW survivorship-bias correction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pygam>=0.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
fetch = ["pybaseball>=2.2"]
notebooks = ["jupyterlab>=4.0", "seaborn>=0.13"]
dev = ["pytest>=8.0"]

[project.scripts]
mlb-aging = "mlb_aging.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlb_aging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
